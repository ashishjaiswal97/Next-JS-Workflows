name: Next-JS build
on:
  push:
    branches: [ main ]
jobs:
  Next-JS:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2.8.0
      - name: Install dependencies for Next-JS
        run: npm install
      - name:  run the Next-js build
        run: npm run build
      - name: Setup Next-JS environment
        uses: actions/setup-node@v6.5.0
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: # optional, default is artifact
          path: out/
      
